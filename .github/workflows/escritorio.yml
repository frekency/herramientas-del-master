# Compila la app de escritorio (Windows y Mac) en GitHub.
# Como datos/privado/ (conjuros.json y libros/) no está en el repositorio, estos instaladores
# solo llevan el SRD: son los que se pueden compartir.
# Se lanza a mano (Actions → Escritorio → Run workflow) o al subir una etiqueta v*.
name: Escritorio
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write   # para publicar la release con los instaladores y latest.yml
jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }} -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
