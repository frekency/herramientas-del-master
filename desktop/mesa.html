<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa</title>
<style>
:root{--fg:#f1ece0;--muted:#a79f8e;--ac:#e0a458;--bg:#0b0a09;--row:#171513}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;cursor:default;user-select:none}
#nada{height:100%}
#img{height:100%;display:none;align-items:center;justify-content:center;position:relative}
#img img{max-width:100%;max-height:100%;object-fit:contain}
#img .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 28px;background:linear-gradient(transparent,rgb(0 0 0/.75));font-size:clamp(18px,2.6vw,36px);font-weight:600;text-align:center}
#img .cap:empty{display:none}
#ini{height:100%;display:none;flex-direction:column;padding:clamp(16px,3vw,48px);gap:clamp(10px,1.6vw,22px)}
#ini header{display:flex;align-items:baseline;gap:18px}
#ini h1{margin:0;font-size:clamp(20px,3vw,44px);font-weight:700}
#ini .ronda{color:var(--ac);font-size:clamp(18px,2.4vw,34px);font-weight:600}
#ini .cuenta{margin-left:auto;font-size:clamp(20px,3vw,44px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ac)}
#ini .cuenta.pausa{color:var(--muted)}
#ini .cuenta small{font-size:.5em;font-weight:600;color:var(--muted);margin-right:.6em}
#avi{height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2vw,28px);padding:clamp(24px,5vw,80px);text-align:center}
#avi h1{margin:0;font-size:clamp(28px,5vw,80px);color:var(--ac);font-weight:800}
#avi p{margin:0;font-size:clamp(22px,3.6vw,56px);line-height:1.25;max-width:24ch}
#cuentas{position:fixed;right:clamp(12px,2vw,28px);bottom:clamp(12px,2vw,28px);display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:5}
.cu{background:rgb(0 0 0/.78);border:2px solid var(--ac);border-radius:14px;padding:8px 20px;text-align:right}
.cu .t{font-size:clamp(28px,5vw,72px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.cu .n{font-size:clamp(14px,1.8vw,26px);color:var(--muted)}
.cu.pausa .t{color:var(--muted)}.cu.fin{border-color:#d0453c}.cu.fin .t{color:#ff6a5e}
body.solo #cuentas{inset:0;align-items:center;justify-content:center;gap:clamp(14px,3vw,40px)}
body.solo .cu{text-align:center;padding:clamp(14px,3vw,40px) clamp(28px,6vw,90px)}
body.solo .cu .t{font-size:clamp(64px,16vw,260px)}body.solo .cu .n{font-size:clamp(20px,3.4vw,56px)}
#lista{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:clamp(6px,1vw,14px)}
.fila{display:flex;align-items:center;gap:16px;padding:clamp(8px,1.4vw,20px) clamp(14px,2vw,28px);background:var(--row);border-left:8px solid var(--c,#888);border-radius:12px;font-size:clamp(18px,3.2vw,48px);font-weight:600;color:var(--muted);transition:transform .2s,background .2s}
.fila .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila.actual{background:color-mix(in srgb,var(--ac) 20%,var(--row));color:var(--fg);outline:3px solid var(--ac);transform:scale(1.02)}
.fila.caido{opacity:.45;text-decoration:line-through}
.fila .flecha{color:var(--ac);width:1em;text-align:center}
#aviso{position:fixed;right:14px;bottom:10px;color:var(--muted);font-size:13px}
/* escenas: lienzo 16:9 con capas colocadas en % (la misma página sirve de vista previa dentro del estudio) */
#esc{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--fondo,#0b0a09)}
#lienzo{position:relative;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9));container-type:size;overflow:hidden;background:var(--fondo,#0b0a09)}
.capa{position:absolute;box-sizing:border-box}
.capa.imagen img{width:100%;height:100%;display:block}
.capa.imagen.marco{padding:.8cqh .8cqh 3cqh;background:#fffdf6;box-shadow:0 .6cqh 3cqh #000a}
.capa.imagen.marco img{background:#fffdf6}
.capa .pie{position:absolute;left:0;right:0;bottom:0;padding:.6em 1em;background:linear-gradient(transparent,#000b);color:#fff;font-size:3cqh;font-weight:600;text-align:center}
.capa.imagen.marco .pie{background:none;color:#3b2a14;padding:0 0 .6cqh}
.capa .pie:empty{display:none}
.capa.texto{display:flex;align-items:center;justify-content:center;padding:.1em .35em;overflow:hidden}
.capa.texto>div{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.2;font-size:calc(var(--tam,6)*1cqh);width:100%}
.capa.texto.izq{justify-content:flex-start}.capa.texto.der{justify-content:flex-end}
.capa.texto.sans>div{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}.capa.texto.serif>div{font-family:Georgia,"Times New Roman",serif}
.capa.texto.manuscrita>div{font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive}
.capa.negrita>div{font-weight:800}
.capa.iniciativa,.capa.cuentas{container-type:size;overflow:hidden;display:flex;flex-direction:column;gap:1cqh}
.capa .ih{display:flex;align-items:baseline;gap:2cqw;font-size:calc(100cqh/(var(--n) + 2)*.46);font-weight:700;color:var(--ac)}
.capa .ih small{color:var(--muted);font-weight:600;font-size:.6em}
.capa .ih .cu2{margin-left:auto;font-variant-numeric:tabular-nums}
.capa .fl{display:flex;align-items:center;gap:2cqw;padding:0 3cqw;flex:none;height:calc(100cqh/(var(--n) + 2) - 1cqh);min-height:0;background:var(--row);border-left:1.2cqw solid var(--c,#888);border-radius:1.4cqw;font-size:calc(100cqh/(var(--n) + 2)*.5);font-weight:600}
.capa .fl .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.capa .fl.actual{background:color-mix(in srgb,var(--ac) 22%,var(--row));outline:.4cqh solid var(--ac)}
.capa .fl.caido{opacity:.45;text-decoration:line-through}
.capa .fl .flecha{color:var(--ac);width:1em;text-align:center}
.capa .cc{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:.5cqh solid var(--ac);border-radius:2cqh;background:#000b;text-align:center}
.capa .cc .t{font-size:calc(100cqh/var(--n)*.5);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.capa .cc .nn{font-size:calc(100cqh/var(--n)*.16);color:var(--muted)}
.capa .cc.pausa .t{color:var(--muted)}.capa .cc.fin{border-color:#d0453c}.capa .cc.fin .t{color:#ff6a5e}
.capa .vacio{color:var(--muted);font-size:4cqh;margin:auto}
.capa.cuentas.fuera{opacity:0!important;transition:opacity .6s;pointer-events:none}
.capa.dados{border-radius:2.4cqh;box-shadow:inset 0 0 0 .9cqh #5b3a1e,inset 0 0 7cqh #000c;display:flex;align-items:center;justify-content:center}
.capa.dados .dlabel{color:#ffffff55;font-size:5cqh;font-weight:700}
/* tablero de la física de los dados: se coloca encima de la capa «dados»; los dados no pueden salir de su recuadro */
#dhost{position:fixed;display:none;z-index:4;pointer-events:none;overflow:hidden;border-radius:1.2vmin}
#dhost canvas{width:100%;height:100%;display:block}
#dres{position:absolute;left:0;right:0;top:0;padding:1.2vmin 1vmin;text-align:center;text-shadow:0 .2vmin 1vmin #000,0 0 .6vmin #000;pointer-events:none;z-index:2}
#dres .tot{font-size:calc(var(--hh,300px)*.2);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
#dres .det{font-size:calc(var(--hh,300px)*.06);font-weight:600;color:#f1ece0;margin-top:.4em}
#dres .eti{font-size:calc(var(--hh,300px)*.05);color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
body.previa{cursor:default}body.previa #aviso{display:none!important}

</style>
</head>
<body>
<div id="nada"></div>
<div id="img"><div class="cap"></div></div>
<div id="ini"><header><h1>Iniciativa</h1><span class="ronda"></span><span class="cuenta" hidden></span></header><div id="lista"></div></div>
<div id="avi"><h1></h1><p></p></div>
<div id="esc"></div>
<div id="dhost"><div id="dres" aria-live="polite"></div></div>
<div id="cuentas" aria-live="polite"></div>
<div id="aviso">F11 o doble clic: pantalla completa</div>
<script>
const $=s=>document.querySelector(s),vistas=['#nada','#img','#ini','#avi','#esc'];
const P=window.__Mesa||(()=>{/* dentro del estudio la propia página hace de vista previa: recibe las escenas por postMessage */
  const o=location.origin;document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('previa'));
  return {onMostrar:cb=>addEventListener('message',e=>{if(e.source===parent&&e.origin===o&&e.data&&typeof e.data==='object')cb(e.data);}),listo:()=>parent.postMessage({mesaListo:1},o),pantallaCompleta(){}};})();
let modo='legacy',escena=null,iniData=null,cuData=null;
const REAL=!!window.__Mesa;   // solo la ventana de la mesa tira de verdad; el marco de vista previa del estudio solo enseña dónde estará la bandeja
function ver(v){document.body.classList.toggle('solo',v==='#nada');for(const s of vistas)$(s).style.display=s===v?(s==='#esc'||s==='#ini'||s==='#img'||s==='#avi'?'flex':'grid'):'none';$('#aviso').style.display=v==='#nada'?'block':'none';}

/* ---- escenas ---- */
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function pintaIni(c){
  c.textContent='';const d=iniData;
  if(!d||!d.lista.length){c.style.setProperty('--n',3);c.append(el('div','vacio','Sin combate'));return;}
  let L=d.lista;const MAX=10;
  if(L.length>MAX){const i=Math.max(0,L.findIndex(e=>e.actual));const a=Math.min(Math.max(0,i-3),L.length-MAX);L=L.slice(a,a+MAX);}
  c.style.setProperty('--n',Math.max(L.length,6));/* mínimo 6 para que con pocos combatientes no se agrande */
  const h=el('div','ih');h.append(el('span','',d.activo?'Ronda '+d.ronda:'Iniciativa'));
  if(d.cuenta){const q=el('span','cu2',(d.cuenta.pausa?'⏸ ':'')+mmss(d.cuenta.seg));q.prepend(el('small','',d.cuenta.n+' '));h.append(q);}
  c.append(h);
  for(const e of L){const f=el('div','fl'+(e.actual?' actual':'')+(e.caido?' caido':''));f.style.setProperty('--c',e.color);
    f.append(el('span','flecha',e.actual?'▶':''),el('span','n',e.n));c.append(f);}
}
function pintaCuentas(c){
  c.textContent='';let L=(cuData&&cuData.lista)||[];
  const cid=c.dataset&&c.dataset.cid;
  if(cid){/* capa con su propia cuenta: enseña solo esa y, si así se pidió, se retira al llegar a cero */
    L=L.filter(q=>q.id===cid);c.classList.toggle('fuera',!!(L[0]&&L[0].fin&&c.dataset.fin==='quitar'));}
  if(!L.length){c.style.setProperty('--n',2);c.append(el('div','vacio','Sin cuentas atrás'));return;}
  c.style.setProperty('--n',L.length);
  for(const q of L){const b=el('div','cc'+(q.pausa?' pausa':'')+(q.fin?' fin':''));b.append(el('div','nn',q.n),el('div','t',(q.fin?'':q.pausa?'⏸ ':'')+mmss(q.seg)));c.append(b);}
}
/* fondo de la escena: color liso o degradado, con una imagen opcional debajo de todo */
function fondoCSS(L,p){
  const caps=[];
  if(p.fsrc)caps.push('url("'+p.fsrc+'")');
  if(p.fondo2)caps.push('linear-gradient('+(p.ang==null?180:p.ang)+'deg,'+p.fondo+','+p.fondo2+')');
  L.style.backgroundColor=p.fondo;
  L.style.backgroundImage=caps.join(',')||'none';
  L.style.backgroundSize=(p.fsrc?(p.fajuste==='contener'?'contain':'cover'):'')+(p.fsrc&&p.fondo2?',':'')+(p.fondo2?'100% 100%':'');
  L.style.backgroundPosition='center';L.style.backgroundRepeat='no-repeat';
}
function construir(p){
  const L=el('div','');L.id='lienzo';L.style.setProperty('--fondo',p.fondo);fondoCSS(L,p);
  for(const c of p.capas){
    if(!c.visible)continue;
    const d=el('div','capa '+c.tipo);d.dataset.id=c.id;
    d.style.cssText='left:'+c.x+'%;top:'+c.y+'%;width:'+c.w+'%;height:'+c.h+'%;opacity:'+c.op;
    if(c.tipo==='imagen'){const im=new Image();im.alt=c.titulo||'';im.src=c.src;im.style.objectFit=c.ajuste==='cubrir'?'cover':'contain';d.append(im);
      if(c.marco)d.classList.add('marco');d.append(el('div','pie',c.titulo));}
    else if(c.tipo==='texto'){d.classList.add(c.alin==='izq'?'izq':c.alin==='der'?'der':'cen',c.fuente);if(c.negrita)d.classList.add('negrita');
      d.style.setProperty('--tam',c.tam);d.style.color=c.color;if(c.fondo)d.style.background=c.fondo;
      const t=el('div','',c.t);t.style.textAlign=c.alin==='izq'?'left':c.alin==='der'?'right':'center';d.append(t);}
    else if(c.tipo==='dados'){d.style.background=c.fondo;d.append(el('div','dlabel',REAL?'':'🎲 Bandeja de dados'));}
    else if(c.tipo==='iniciativa')pintaIni(d);
    else if(c.tipo==='cuentas'){d.dataset.cid=c.cid||'';d.dataset.fin=c.fin||'';pintaCuentas(d);}
    L.append(d);
  }
  return L;
}
/* ---- bandeja de dados: física real con dice-box (MIT, vendor/dice-box) ---- */
let DB=null,DBp=null,dbTam='',dbCfg='',dbPend=null;
function dadosCapa(){const c=$('#lienzo');return c?c.querySelector('.capa.dados'):null;}
function dadosMotor(cfg){
  if(!DBp)DBp=(async()=>{
    const {default:DiceBox}=await import('./vendor/dice-box/dice-box.es.min.js');
    const b=new DiceBox({container:'#dhost',assetPath:'/vendor/dice-box/assets/',scale:cfg.escala,theme:'default',themeColor:cfg.color,offscreen:true,throwForce:6,spinForce:4,gravity:2});
    b.onRollComplete=r=>dadosResultado(r);
    await b.init();DB=b;return b;})().catch(e=>{DBp=null;throw e;});
  return DBp;
}
function posicionaDados(){
  const h=$('#dhost'),capa=dadosCapa(),cfg=escena&&escena.capas.find(c=>c.tipo==='dados'&&c.visible);
  if(!capa||!cfg){h.style.display='none';if(DB&&!capa){try{DB.clear();}catch{}$('#dres').textContent='';}return;}
  const r=capa.getBoundingClientRect();
  h.style.display='block';h.style.left=r.left+'px';h.style.top=r.top+'px';h.style.width=r.width+'px';h.style.height=r.height+'px';h.style.setProperty('--hh',r.height+'px');
  h.style.opacity=cfg.op;
  const k=Math.round(r.width)+'x'+Math.round(r.height);
  if(k!==dbTam){dbTam=k;if(DB)dispatchEvent(new Event('resize'));}
  const c2=cfg.escala+'|'+cfg.color;
  if(DB&&c2!==dbCfg){dbCfg=c2;try{DB.updateConfig({scale:cfg.escala,themeColor:cfg.color});}catch{}}
}
/* «2d6+3» → grupos de dados con su signo y un modificador suelto */
function troceaTirada(n){
  const g=[];let mod=0;
  for(const m of n.matchAll(/([+-]?)(\d+)(d(\d+))?/g)){
    const sg=m[1]==='-'?-1:1;
    if(m[3])g.push({sg,qty:+m[2],sides:+m[4],not:m[2]+'d'+m[4]});else mod+=sg*+m[2];
  }
  return {g,mod};
}
async function tirar(p){
  if(!dadosCapa())return;
  const cfg=escena&&escena.capas.find(c=>c.tipo==='dados'&&c.visible);if(!cfg)return;
  let b;try{b=await dadosMotor(cfg);}catch(e){$('#dres').textContent='';const d=el('div','det','No se pudo cargar la bandeja de dados');$('#dres').append(d);return;}
  posicionaDados();
  const t=troceaTirada(p.notacion);
  dbPend={p,t};
  $('#dres').textContent='';
  try{b.clear();}catch{}
  b.roll(t.g.map(x=>x.not));
}
function dadosResultado(r){
  const pe=dbPend;if(!pe||!Array.isArray(r))return;dbPend=null;
  const valores=[];let total=pe.t.mod;
  pe.t.g.forEach((g,i)=>{const gr=r[i]||{rolls:[]};const v=gr.rolls.map(x=>+x.value);valores.push(...v.map(x=>g.sg*x));total+=g.sg*v.reduce((a,b)=>a+b,0);});
  const R=$('#dres');R.textContent='';
  if(pe.p.etiqueta)R.append(el('div','eti',pe.p.etiqueta));
  R.append(el('div','tot',String(total)));
  const det=valores.map((v,i)=>v<0?'− '+(-v):(i?'+ ':'')+v).join(' ')+(pe.t.mod?(pe.t.mod<0?' − ':' + ')+Math.abs(pe.t.mod):'');
  R.append(el('div','det',pe.p.notacion+' · '+det));
  if(P.resultado)P.resultado({notacion:pe.p.notacion,total,dados:valores,mod:pe.t.mod});
}
addEventListener('resize',posicionaDados);
let escTok=0;
async function ponerEscena(p){
  const tok=++escTok,E=$('#esc'),nuevo=construir(p);
  await Promise.all([...nuevo.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0));
  if(tok!==escTok)return;
  const viejo=$('#lienzo');
  E.style.setProperty('--fondo',p.fondo);
  const ms=viejo?p.fundido:0;
  nuevo.style.transition='opacity '+ms+'ms';
  if(ms)nuevo.style.opacity=0;
  E.append(nuevo);
  if(ms){nuevo.getBoundingClientRect();nuevo.style.opacity=1;}
  if(viejo){viejo.id='';setTimeout(()=>viejo.remove(),ms+60);}
  actualizaOverlay();posicionaDados();
}
function quitaEscena(){escena=null;escTok++;const v=$('#lienzo');if(v)v.remove();posicionaDados();}
function actualizaVivas(){
  const c=$('#lienzo');
  if(c){c.querySelectorAll('.capa.iniciativa').forEach(pintaIni);c.querySelectorAll('.capa.cuentas').forEach(pintaCuentas);}
  actualizaOverlay();
}
function actualizaOverlay(){
  /* si la escena ya trae una capa de cuentas atrás, la esquina de siempre se queda quieta */
  $('#cuentas').style.display=modo==='escena'&&escena&&escena.capas.some(c=>c.tipo==='cuentas'&&c.visible)?'none':'';
}
function mostrar(p){
  if(!p)return;
  if(p.tipo==='dados'){tirar(p);return;}
  if(p.tipo==='escena'){modo='escena';escena=p;ver('#esc');ponerEscena(p);return;}
  if(p.tipo==='cuentas'){
    cuData=p;
    const C=$('#cuentas');C.textContent='';
    for(const c of p.lista){const d=document.createElement('div');d.className='cu'+(c.pausa?' pausa':'')+(c.fin?' fin':'');
      const n=document.createElement('div');n.className='n';n.textContent=c.n;
      const t=document.createElement('div');t.className='t';t.textContent=(c.fin?'':c.pausa?'⏸ ':'')+String(Math.floor(c.seg/60)).padStart(2,'0')+':'+String(c.seg%60).padStart(2,'0');
      d.append(n,t);C.append(d);}
    actualizaVivas();
    return;}
  if(p.tipo==='limpiar'){modo='legacy';quitaEscena();ver('#nada');actualizaOverlay();return;}
  if(p.tipo==='imagen'){
    modo='legacy';quitaEscena();actualizaOverlay();
    $('#img img')?.remove();
    const im=new Image();im.alt=p.titulo||'';im.src=p.src;$('#img').prepend(im);
    $('#img .cap').textContent=p.titulo||'';ver('#img');return;}
  if(p.tipo==='aviso'){modo='legacy';quitaEscena();actualizaOverlay();$('#avi h1').textContent=p.titulo||'';$('#avi p').textContent=p.texto||'';ver('#avi');return;}
  if(p.tipo==='iniciativa'){
    iniData=p;
    if(modo==='escena'&&!p.abrir){actualizaVivas();return;}
    modo='legacy';quitaEscena();actualizaOverlay();
    const c=$('#ini .cuenta');
    if(p.cuenta){const s=p.cuenta.seg,m=String(Math.floor(s/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');
      c.textContent='';const sm=document.createElement('small');sm.textContent=p.cuenta.n;c.append(sm,(p.cuenta.pausa?'⏸ ':'')+m+':'+x);c.classList.toggle('pausa',!!p.cuenta.pausa);c.hidden=false;}
    else{c.hidden=true;}
    $('#ini .ronda').textContent=p.activo?'Ronda '+p.ronda:'';
    const L=$('#lista');L.textContent='';
    for(const e of p.lista){
      const d=document.createElement('div');d.className='fila'+(e.actual?' actual':'')+(e.caido?' caido':'');d.style.setProperty('--c',e.color);
      const f=document.createElement('span');f.className='flecha';f.textContent=e.actual?'▶':'';
      const n=document.createElement('span');n.className='n';n.textContent=e.n;
      d.append(f,n);L.append(d);
    }
    if(!p.lista.length){const d=document.createElement('div');d.className='fila';d.textContent='Sin combate';L.append(d);}
    const a=L.querySelector('.actual');if(a)a.scrollIntoView({block:'nearest'});
    ver('#ini');
  }
}
P.onMostrar(mostrar);
P.listo();
addEventListener('dblclick',()=>P.pantallaCompleta());
addEventListener('keydown',e=>{if(e.key==='F11'){e.preventDefault();P.pantallaCompleta();}});
</script>
</body>
</html>
